<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (64x64) -->
  <g transform="translate(0, 0)">
    <!-- Background Rounded Badge -->
    <rect width="56" height="56" x="4" y="4" rx="14" fill="url(#logoBgGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Speed Lines -->
    <path d="M12 24 H22" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M9 31 H19" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M14 38 H21" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Motorcycle Courier Symbol -->
    <!-- Rear Wheel -->
    <circle cx="24" cy="40" r="7.5" fill="none" stroke="#F8FAFC" stroke-width="3"/>
    <circle cx="24" cy="40" r="2.5" fill="#F59E0B"/>
    
    <!-- Front Wheel -->
    <circle cx="45" cy="40" r="7.5" fill="none" stroke="#F8FAFC" stroke-width="3"/>
    <circle cx="45" cy="40" r="2.5" fill="#F59E0B"/>

    <!-- Bike Frame and Fork -->
    <path d="M24 40 L32 31 L41 31 L45 40" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Courier Baú -->
    <rect x="18" y="21" width="10" height="10" rx="2" fill="#F59E0B" stroke="#B45309" stroke-width="1.2"/>

    <!-- Rider Body & Helmet -->
    <circle cx="34" cy="18" r="4.5" fill="#F8FAFC"/>
    <path d="M32 23 L38 27 L41 31" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Active Green Beacon -->
    <circle cx="48" cy="14" r="4" fill="#10B981"/>
    <circle cx="48" cy="14" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography Right -->
  <text x="70" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" letter-spacing="-0.5">
    MOTOBOY <tspan fill="#F59E0B">&amp; LOGÍSTICA</tspan>
  </text>
  <text x="70" y="44" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="1.5">
    EXPRESS • BASE DUTRA 225
  </text>
</svg>
